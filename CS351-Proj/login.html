<!DOCTYPE html>
<html>
    <link rel="stylesheet" href="landing-page.css"/>
    <body>
    <div class = "sideProfile">
        <div class = "loginUser">
            <h3>
                Hello Welcome to
            </h3>
            <h1>
                ConDANtioning Fitness
            </h1>
            <br> 
            <div class = "loginInfo">
                <form class = "loginField">
                    <label for="username"> Username:</label>
                    <input type = "text" id="username" required>
                </form>
                <form class = "loginField">
                    <label for="pass"> Password:</label>
                    <input type = "password" id="pass" name="pass" maxlength="12" required>
                </form>
            </div>
            <div class = "createInfo">
                <form class = "loginField">
                    <label for="weight"> Weight:</label><br>
                    <input type = "number" id="weight" required>
                    <select id="weightMeasurement" name = "weightMeasurement">
                        <option value = "lbs"> lbs</option>
                        <option value = "kg"> kg</option>
                    </select>
                </form>
                <form class = "loginField">
                    <label for="height"> Height:</label><br>
                    <input type = "number" id="height" required>
                    <select id="heightMeasurement1" name = "heightMeasurement1">
                        <option value = "ft"> ft</option>
                        <option value = "m"> m</option>
                    </select>
                    <input type = "number" id="height" required>
                    <select id="heightMeasurement2" name = "heightMeasurement2">
                        <option value = "in"> in</option>
                        <option value = "cm"> cm</option>
                    </select>
                </form>
                <form class = "loginField">
                    <label for="goal"> Goal Weight:</label><br>
                    <input type = "number" id="goal" required>
                    <select id="weightMeasurement" name = "weightMeasurement">
                        <option value = "lbs"> lbs</option>
                        <option value = "kg"> kg</option>
                    </select>
                </form>
            </div>
            <hr>
            <div class = "buttonLayout">
                <button class = "button" id = "log">
                    login
                </button>
                <button class = "button" id = "register">
                    register
                </button>
                <button class = "button" id = "signUp">
                    sign up
                </button>
            </div>
        </div>
    </div>
    <div class = "mainPicture">
        <img src="pictures/test.jpg" alt ="default green pfp" />
      
    </div>
    </body>
    
</html>
