<!DOCTYPE html>
<html>
<head>  
    <title>
        conDANtioning Tracker
    </title>
    <link rel="stylesheet" href="style.css"/>
</head>

<body>
    <div class = "sidebar">
        <ul class = "tabs">
            <li class = "active">
                <a href="#">
                    <span>Dashboard</span>
                </a>
            </li>
            <li>
                <a href="profile.html">
                    <span>profile</span>
                </a>
            </li>
             <!-- didn't have time to add these
            <li>
                <a href="progress.html">
                    <span >progress</span>
                </a>
            </li>
           
            <li>
                <a href="#">
                    <span>settings</span>
                </a>
            </li>
            <li class ="logout" >
                <a href="#">
                    <span>logout</span>
                </a>
            </li>
            -->
        </ul>
    </div>
    <div class ="mainContent">
        <div class="headerWrapper">
            <div class = HeaderTitle>
                <span>
                    Primary
                </span>
                <h2>
                    Dashboard
                </h2>
            </div>
            <div class = "userInfo">
                <div class = "searchBox">
                    <i class = "dashSearch">
                </i>
                <input type = "text"
                placeholder="Search"/>
                </div>
                
                <a href="profile.html">
                     <img src="pictures/defaultPFP.jpg" alt ="default green pfp" />
                </a>
            </div>
        </div>  
            <div class="cardContainer">
            <h3 class="mainTitle">
                Today's data
            </h3>
            <div class = "cards">
                <div class="cardWrapper">
                    <div class = "pinnedCard">
                        <div class="cardHeader">
                            <div class="dataPoints">
                                <span class = "title">
                                    <big>
                                        Goal Progress
                                    </big>
                                </span> 
                            </div>
                        </div>
                        <span class="cardDetail">
                            <canvas id="weightChart"></canvas>
                        </span>
                        
                    </div>
    
                    <div class = "pinnedCard">
                        <div class="cardHeader">
                            <div class="dataPoints">
                                <span class = "title">
                                    <big>
                                        BMI
                                    </big>
                                </span> 
                            </div>
                        </div>
                        <span class="cardDetail2">
                            --.-
                        </span>
                    </div>
                </div>
            </div>
        </div>
        <div class = "dailyDiary">
            <hr>
            <div class = "calendar">
                <button id = "backButton">
                Last
           </button>
           <input type="date" id="date"  required/>
            <button id = "forwardButton">
                Next
            </button>
            </div>
        </div>
        <div class = "exerciseCard">
            <div class = "exercise">
                <div class = "exerciseInfo">
                    <h3>
                        Exercise
                    </h3>
                    <span>
                    <p>Daily Avg: </p>
                    <p id = "timeAvg">--</p>
                    </span>
                </div>
                <div class = "userAddExercise">
                    <img id = "addEx"src="pictures/plus.png" alt ="default add sign" />
                </div>
            </div>
            <form class="hidden" id = "exerciseForm">
                <label for="exerciseName">Exercise Name:</label>
                <input type="text" id="exerciseName" name="exerciseName" required />
        
                <label for="duration">Duration (mins):</label>
                <input type="number" id="duration" name="duration" required />
        
                <button type="submit" class = "addExerciseButton">Add Exercise</button>
                <hr>
            </form>
        </div>

        <div class = "weightCard">
            <h2>
                Goal
            </h2>
            <div class = "weight">
                <span>
                    <h2>
                        Goal Weight:
                    </h2>
                    <h2 id ="userWeight">
                        --
                    </h2>
                </span>
                
            </div>
            <img src = "pictures/weightScale.png" alt="a weight scale">
            <div>
                <div class = "progress">
                    <p id = "usersProgress">

                    </p> 
                </div>
            </div> 
            <div class="weightUpdate">
                <hr>
                <h1>
                    Update Weight
                </h1>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src = "index.js"></script>
</body>

</html>
